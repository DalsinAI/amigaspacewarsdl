<?xml version="1.0" encoding="UTF-8"?>
<!-- Spacewar's GlowIcon art: a blue ship and a red ship trading laser fire
     among the stars. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="6" y="6" width="116" height="116" rx="10" fill="#060618" stroke="#000008" stroke-width="3"/>
  <g fill="#ffffff">
    <circle cx="20" cy="22" r="1.4"/><circle cx="48" cy="14" r="1"/><circle cx="90" cy="20" r="1.5"/>
    <circle cx="110" cy="40" r="1"/><circle cx="64" cy="34" r="1.2"/><circle cx="16" cy="70" r="1"/>
    <circle cx="40" cy="104" r="1.4"/><circle cx="80" cy="110" r="1"/><circle cx="108" cy="96" r="1.3"/>
    <circle cx="62" cy="90" r="1"/>
  </g>
  <!-- the lasers -->
  <rect x="40" y="46" width="22" height="4" rx="2" fill="#66ccff"/>
  <rect x="66" y="78" width="22" height="4" rx="2" fill="#ff6655"/>
  <!-- the blue ship, facing right -->
  <g stroke="#0a2a66" stroke-width="1.5">
    <path d="M14 36 L36 48 L14 60 L20 48 Z" fill="#3388ee"/>
    <circle cx="26" cy="48" r="3.5" fill="#bbe4ff"/>
  </g>
  <!-- the red ship, facing left -->
  <g stroke="#661010" stroke-width="1.5">
    <path d="M114 68 L92 80 L114 92 L108 80 Z" fill="#ee3333"/>
    <circle cx="102" cy="80" r="3.5" fill="#ffd0c8"/>
  </g>
  <!-- a hit -->
  <g fill="#ffdd44">
    <path d="M64 60 L67 54 L69 60 L75 58 L70 63 L74 68 L68 66 L65 72 L63 66 L57 67 L61 63 L56 58 Z"/>
  </g>
</svg>
